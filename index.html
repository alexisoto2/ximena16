<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente | Eimy Ximena ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-pink: #fbcfe8;
            --soft-rose: #f472b6;
            --deep-rose: #db2777;
            --card-bg: rgba(255, 255, 255, 0.3);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-dark: #4a2840;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #fbcfe8 0%, #f3e8ff 50%, #fce7f3 100%);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.12);
        }

        /* Estilos para la sección del Logo */
        .logo-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-width: 100px;
            height: auto;
            filter: drop-shadow(0 4px 10px rgba(219, 39, 119, 0.15));
            border-radius: 50%;
        }

        .brand-tag {
            font-size: 0.75em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--deep-rose);
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2em;
            color: var(--deep-rose);
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.6);
        }

        .coming-soon {
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #704a60;
            margin-bottom: 30px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 25px 0 35px 0;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(244, 114, 182, 0.3);
            padding: 15px 5px;
            border-radius: 18px;
        }

        .time-num {
            font-size: 1.8em;
            font-weight: 600;
            color: var(--deep-rose);
            display: block;
        }

        .time-label {
            font-size: 0.7em;
            color: #704a60;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-brand {
            font-size: 0.7em;
            letter-spacing: 2px;
            color: rgba(74, 40, 64, 0.6);
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.6em; }
            .coming-soon { font-size: 0.95em; }
            .time-num { font-size: 1.4em; }
            .logo-img { max-width: 80px; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="card">
        <!-- Apartado de Logo -->
        <div class="logo-container">
            <img src="logo.png" alt="HAUS DEUS DIGITAL" class="logo-img">
        </div>

        <div class="brand-tag">HAUS DEUS DIGITAL</div>
        <h1>Eimy Ximena</h1>
        <div class="coming-soon">✨ PRÓXIMAMENTE ✨</div>

        <div class="countdown-grid">
            <div class="time-box"><span class="time-num" id="days">00</span><span class="time-label">Días</span></div>
            <div class="time-box"><span class="time-num" id="hours">00</span><span class="time-label">Horas</span></div>
            <div class="time-box"><span class="time-num" id="minutes">00</span><span class="time-label">Min</span></div>
            <div class="time-box"><span class="time-num" id="seconds">00</span><span class="time-label">Seg</span></div>
        </div>

        <div class="footer-brand">HAUS DEUS DIGITAL</div>
    </div>

    <script>
        // Fondo de partículas flotantes
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(244, 114, 182, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Temporizador enfocado al 29 de Agosto de 2026
        const target = new Date("August 29, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            if (diff > 0) {
                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById('minutes').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                document.getElementById('seconds').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            } else {
                document.querySelector('.countdown-grid').innerHTML = "<p style='grid-column: span 4; font-size: 1.1em; color: var(--deep-rose); font-weight:600;'>🎉 ¡LLEGÓ EL DÍA! 🎉</p>";
            }
        }, 1000);
    </script>
</body>
</html>
